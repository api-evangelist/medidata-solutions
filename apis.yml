apis:
- name: Rave Web Services (RWS)
  description: >-
    RESTful web-services API for Medidata Rave EDC. Enables external systems to
    push, pull, and edit clinical trial data using the CDISC ODM standard -
    clinical data (ODM/CSV), study design metadata (forms, fields, codelists),
    protocol deviations, comments, and audit-trail history. Uses HTTP Basic or
    MAuth request-signing authentication over a per-tenant mdsol.com subdomain.
  humanURL: https://www.medidata.com/en/clinical-trial-services/developer-central/
  baseURL: https://innovate.mdsol.com/RaveWebServices
