aid: medidata-solutions
name: Medidata Solutions
description: >-
  Medidata Solutions is a Dassault Systemes company providing a unified cloud
  platform for clinical research in life sciences. Its flagship Rave EDC
  (electronic data capture) system and surrounding products power clinical
  trial data collection, management, randomization, imaging, safety, and
  patient-centric technology. For integrators, Medidata exposes Rave Web
  Services (RWS) - a RESTful API set that lets external systems push data to,
  pull data from, and edit data within Medidata Rave using the CDISC ODM
  (Operational Data Model) clinical-trial data standard. Access is coordinated
  through Medidata Developer Central, a membership program offering RWS
  documentation, a test environment, community support, and first-party Python
  client libraries (rwslib, requests-mauth, mauth-client). Authentication uses
  HTTP Basic auth or Medidata's MAuth request-signing scheme.
