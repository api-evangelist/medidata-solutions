generated: '2026-07-20'
method: searched
source: http://rws-webhelp.s3.amazonaws.com/WebHelp_ENG/introduction/index.html
api: Rave Web Services (RWS)
authentication:
  styles: [http-basic, mauth-request-signing]
  ref: authentication/medidata-solutions-authentication.yml
transport:
  protocol: https
  style: REST
  base_host_pattern: https://{subdomain}.mdsol.com/RaveWebServices
  note: >-
    A hostname without a scheme is treated as an mdsol.com subdomain
    (e.g. "innovate" resolves to https://innovate.mdsol.com). Data is posted to
    or retrieved from specific RWS URLs using standard HTTP methods.
data_formats:
  request: [CDISC ODM XML]
  response: [CDISC ODM XML, CSV]
  standard: CDISC ODM (Operational Data Model)
url_conventions:
  study_addressing: >-
    Studies addressed by study OID as studyoid={project_name}({environment_name}),
    e.g. datasets/ClinicalAuditRecords.odm/?studyoid=Mediflex(Prod)
  datasets: /RaveWebServices/datasets/<DatasetName>.odm/
idempotency:
  supported: false
  note: >-
    RWS does not document a dedicated idempotency-key mechanism; clinical data
    posts are ODM messages processed against study/subject state. No
    Idempotency-Key contract is published.
pagination:
  documented: false
  note: >-
    Bulk extract endpoints (e.g. Clinical Audit Records / ODM Adapter) use
    startid / per_page style windowing on some datasets rather than a uniform
    cursor scheme; consult the dataset documentation.
versioning:
  ref: lifecycle/medidata-solutions-lifecycle.yml
errors:
  note: >-
    RWS returns HTTP status codes with an ODM/text error body (RWS error
    responses), not RFC 9457 problem+json.
